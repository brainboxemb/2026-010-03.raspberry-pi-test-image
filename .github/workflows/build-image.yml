name: Build Brainbox Zero image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/image.env"
      - "overlay/**"
      - "scripts/build-image.sh"
      - ".github/workflows/build-image.yml"
  push:
    tags:
      - "image-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils util-linux rsync curl

      - name: Verify image scripts
        run: |
          bash -n scripts/build-image.sh
          bash -n overlay/rootfs/usr/local/bin/verify-brainbox-zero

      - name: Build image
        run: |
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_SHA bash scripts/build-image.sh

      - name: List output
        run: |
          ls -lh out/
          cd out
          sha256sum --check *.sha256

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainbox-zero
          path: |
            out/*.img.xz
            out/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged image release
    if: startsWith(github.ref, 'refs/tags/image-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: brainbox-zero
          path: out

      - name: Verify checksum
        run: |
          cd out
          sha256sum --check *.sha256

      - name: Publish immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            out/*.img.xz out/*.sha256 \
            --verify-tag \
            --title "Brainbox Zero $GITHUB_REF_NAME" \
            --notes "Factory SD-card image. Write from another computer/SD reader. Not an on-device updater."
